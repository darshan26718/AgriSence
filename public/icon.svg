<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#052e16" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded App Tile -->
  <rect width="512" height="512" rx="128" fill="url(#greenGrad)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="#22c55e" stroke-width="8" stroke-opacity="0.3" />

  <!-- Sun Rays Glow -->
  <circle cx="360" cy="150" r="48" fill="url(#goldGrad)" opacity="0.9" filter="url(#shadow)" />

  <!-- Growing Plant / Sprout Emblem -->
  <g transform="translate(136, 120)" filter="url(#shadow)">
    <!-- Soil mound -->
    <path d="M 20 250 C 60 220, 180 220, 220 250 C 200 270, 40 270, 20 250 Z" fill="#854d0e" />
    
    <!-- Plant Stem -->
    <path d="M 120 240 Q 120 140 120 70" stroke="#f0fdf4" stroke-width="18" stroke-linecap="round" fill="none" />
    
    <!-- Left Leaf -->
    <path d="M 120 170 C 60 170, 30 130, 40 80 C 80 80, 120 120, 120 170 Z" fill="#4ade80" />
    <path d="M 120 170 C 80 140, 60 110, 40 80" stroke="#166534" stroke-width="4" fill="none" />

    <!-- Right Leaf -->
    <path d="M 120 120 C 180 110, 210 70, 200 20 C 160 30, 120 70, 120 120 Z" fill="#86efac" />
    <path d="M 120 120 C 160 90, 180 60, 200 20" stroke="#166534" stroke-width="4" fill="none" />
  </g>
</svg>
